<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            background-color: rgb(223, 222, 217);
        }

        .box {
            height: 200px;
            width: 200px;
            margin: 30px;
            font-size: 20px;
        }

        #box1 {
            background-color: rgb(117, 0, 51);
            font-size: 10px;
            position: static;

        }

        #box2 {
            background-color: rgb(178, 24, 112);
            font-size: 10px;
            position: relative;
            top: 20px;
            left: 50px;

        }

        #box3 {
            background-color: rgb(242, 0, 137);
            font-size: 10px;

        }

        #box4 {
            background-color: rgb(255, 42, 184);
            font-size: 10px;

        }

        #box5 {
            background-color: rgb(115, 57, 81);
            font-size: 10px;

        }
        #box6 {
            background-color: rgb(153, 112, 122);
            font-size: 10px;

        }

        #box7 {
            background-color: rgb(176, 17, 176);
            font-size: 10px;

        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box" id="box1">1. I am static</div>
        <div class="box" id="box2">2. I am rlative (shifted)</div>
        <div class="box" id="box3">3. I am absolute (top right of parent)</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
    </div>
</body>

</html>
