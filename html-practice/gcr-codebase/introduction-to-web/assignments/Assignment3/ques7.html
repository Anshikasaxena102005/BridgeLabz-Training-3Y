<!DOCTYPE html>
<html>
<head>
    <title>Conference Schedule</title>
</head>
<body>

    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <!-- Conference Schedule -->
    <table border="1">

        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Morning</td>
                <td>10:00 AM</td>
                <td>Cloud Computing</td>
                <td>Dr. Sharma</td>
            </tr>

            <tr>
                <td>Afternoon</td>
                <td>1:00 PM</td>
                <td>Artificial Intelligence</td>
                <td>Ms. Verma</td>
            </tr>

            <tr>
                <td>Evening</td>
                <td>4:00 PM</td>
                <td>Future of Technology</td>
                <td>Mr. Singh</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Conference ends at 5:00 PM</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
