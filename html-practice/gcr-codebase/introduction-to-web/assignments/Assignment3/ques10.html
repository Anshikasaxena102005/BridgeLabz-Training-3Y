<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <!-- Country Selection -->
    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State Selection -->
    <label for="state">State:</label>

    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Kerala</option>
    </select>

    <br><br>

    <!-- City Selection -->
    <label for="city">City:</label>

    <select id="city">
        <option selected>Mathura</option>
        <option>Jaipur</option>
        <option>Goa</option>
        <option>Kochi</option>
    </select>

    <br><br>

    <!-- Tourist Place Selection -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Vrindavan</option>
        <option>Taj Mahal</option>
        <option>Amber Fort</option>
        <option>Marine Beach</option>
    </select>

    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Mathura, and my favorite tourist place is Vrindavan.
    </p>

</body>
</html>
